buildscript {
  repositories {
    google()
    mavenCentral()
  }
}

apply plugin: "com.android.library"

android {
  namespace "com.guilhermefrick.blepresence"

  compileSdkVersion rootProject.ext.has("compileSdkVersion") ? rootProject.ext.get("compileSdkVersion") : 35

  defaultConfig {
    minSdkVersion rootProject.ext.has("minSdkVersion") ? rootProject.ext.get("minSdkVersion") : 23
    targetSdkVersion rootProject.ext.has("targetSdkVersion") ? rootProject.ext.get("targetSdkVersion") : 35
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
}
